<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html {
            height: 100%;
        }

        .calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            padding: 25px;
            max-width: 320px;
            width: 100%;
        }

        .display {
            background: #f1f3f4;
            border: none;
            border-radius: 12px;
            font-size: 2.2rem;
            font-weight: 400;
            text-align: right;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            color: #333;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: 600;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 65px;
        }

        .number {
            background: #f8f9fa;
            color: #333;
        }

        .number:hover {
            background: #e9ecef;
            transform: scale(1.05);
        }

        .operator {
            background: #ff7675;
            color: white;
        }

        .operator:hover {
            background: #e84393;
            transform: scale(1.05);
        }

        .equals {
            background: #00b894;
            color: white;
            grid-column: span 2;
        }

        .equals:hover {
            background: #00a085;
            transform: scale(1.05);
        }

        .clear {
            background: #fd79a8;
            color: white;
        }

        .clear:hover {
            background: #e84393;
            transform: scale(1.05);
        }

        .zero {
            grid-column: span 2;
        }

        @media (max-width: 480px) {
            .calculator {
                margin: 10px;
                padding: 20px;
            }
            
            .display {
                font-size: 1.8rem;
                padding: 15px;
            }
            
            button {
                font-size: 1.2rem;
                padding: 15px;
                min-height: 55px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="clear" onclick="clearAll()">AC</button>
            <button class="clear" onclick="clearEntry()">CE</button>
            <button class="operator" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="setOperation('÷')">÷</button>
            
            <button class="number" onclick="inputNumber('7')">7</button>
            <button class="number" onclick="inputNumber('8')">8</button>
            <button class="number" onclick="inputNumber('9')">9</button>
            <button class="operator" onclick="setOperation('×')">×</button>
            
            <button class="number" onclick="inputNumber('4')">4</button>
            <button class="number" onclick="inputNumber('5')">5</button>
            <button class="number" onclick="inputNumber('6')">6</button>
            <button class="operator" onclick="setOperation('-')">-</button>
            
            <button class="number" onclick="inputNumber('1')">1</button>
            <button class="number" onclick="inputNumber('2')">2</button>
            <button class="number" onclick="inputNumber('3')">3</button>
            <button class="operator" onclick="setOperation('+')">+</button>
            
            <button class="number zero" onclick="inputNumber('0')">0</button>
            <button class="number" onclick="inputDecimal()">.</button>
            <button class="equals" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentNumber = '0';
        let previousNumber = null;
        let operation = null;
        let waitingForNewNumber = false;

        function updateDisplay() {
            display.textContent = currentNumber;
        }

        function inputNumber(num) {
            if (waitingForNewNumber) {
                currentNumber = num;
                waitingForNewNumber = false;
            } else {
                currentNumber = currentNumber === '0' ? num : currentNumber + num;
            }
            updateDisplay();
        }

        function inputDecimal() {
            if (waitingForNewNumber) {
                currentNumber = '0.';
                waitingForNewNumber = false;
            } else if (currentNumber.indexOf('.') === -1) {
                currentNumber += '.';
            }
            updateDisplay();
        }

        function setOperation(op) {
            if (previousNumber !== null && !waitingForNewNumber) {
                calculateResult();
            }
            
            previousNumber = parseFloat(currentNumber);
            operation = op;
            waitingForNewNumber = true;
        }

        function calculateResult() {
            if (previousNumber === null || operation === null) {
                return;
            }

            let current = parseFloat(currentNumber);
            let result;

            switch (operation) {
                case '+':
                    result = previousNumber + current;
                    break;
                case '-':
                    result = previousNumber - current;
                    break;
                case '×':
                    result = previousNumber * current;
                    break;
                case '÷':
                    if (current === 0) {
                        currentNumber = 'Error';
                        previousNumber = null;
                        operation = null;
                        waitingForNewNumber = true;
                        updateDisplay();
                        return;
                    }
                    result = previousNumber / current;
                    break;
                default:
                    return;
            }

            // Round to avoid floating point precision issues
            currentNumber = parseFloat(result.toPrecision(12)).toString();
            previousNumber = null;
            operation = null;
            waitingForNewNumber = true;
            updateDisplay();
        }

        function clearAll() {
            currentNumber = '0';
            previousNumber = null;
            operation = null;
            waitingForNewNumber = false;
            updateDisplay();
        }

        function clearEntry() {
            currentNumber = '0';
            updateDisplay();
        }

        function deleteLast() {
            if (currentNumber.length > 1) {
                currentNumber = currentNumber.slice(0, -1);
            } else {
                currentNumber = '0';
            }
            updateDisplay();
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                inputNumber(key);
            } else if (key === '.') {
                inputDecimal();
            } else if (key === '+') {
                setOperation('+');
            } else if (key === '-') {
                setOperation('-');
            } else if (key === '*') {
                setOperation('×');
            } else if (key === '/') {
                event.preventDefault();
                setOperation('÷');
            } else if (key === 'Enter' || key === '=') {
                calculateResult();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === 'Backspace') {
                deleteLast();
            }
        });
    </script>

</html>
